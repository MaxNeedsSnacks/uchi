# version: 1.0.0

add_newline = true
command_timeout = 5000
continuation_prompt = "[▸▹ ](dimmed)"

format = """
$sudo\
$shell\
($username$hostname$localip[·](dimmed))\
$directory[·](dimmed)\
(\
($direnv[·](dimmed))\
($nix_shell[·](dimmed))\
($meson[·](dimmed))\
($conda[·](dimmed))\
($docker_context[·](dimmed))\
($kubernetes[·](dimmed))\
($container[·](dimmed))\
($package[·](dimmed))\
)\
$fill\
($git_branch\
$git_commit\
$git_state\
$git_status\
([·](dimmed)$git_metrics))\
$line_break\
([◄ ](italic yellow)$cmd_duration$status)\
$character"""

right_format = """
$bun\
$c\
$cpp\
$cmake\
$crystal\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$golang\
$haskell\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nodejs\
$perl\
$php\
$python\
$rlang\
$ruby\
$rust\
$scala\
$swift\
$zig\
$custom\
$os\
$jobs\
$shlvl\
$time"""

#[·](dimmed)
[fill]
symbol = '·'
style = 'dimmed'

[character]
format = "$symbol "
success_symbol = "[◎](bold italic yellow)"
error_symbol = "[○](italic purple)"

# region core
[sudo]
format = '[$symbol]($style)'
style = "bold italic bright-purple"
symbol = "⋈┈"
disabled = false

[username]
style_user = "bright-yellow bold"
style_root = "red bold"
format = "[⭘ $user]($style)"
disabled = false
show_always = false

[hostname]
ssh_only = true
ssh_symbol = "[@](white)"
format = "[$ssh_symbol$hostname]($style)"
style = "green bold"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold magenta)"
disabled = true

# ┤├
[directory]
home_symbol = "~"
read_only = " ◈"
use_os_path_sep = true
style = "bold bright-cyan"
format = """
[🮤](dimmed)\
[ $path]($style)\
[$read_only]($read_only_style)\
[🮥](dimmed)\
"""

[cmd_duration]
format = "[$duration ](italic)"

[status]
disabled = false
map_symbol = true
sigint_symbol = "󰗼"
symbol = ''
not_executable_symbol = ''
not_found_symbol = '?'
signal_symbol = ''
format = "[$symbol $status ]($style)"
style = "bold red"

[jobs]
format = "[$symbol$number ]($style)"
style = "white"
symbol = "[▶](blue italic)"

[shlvl]
disabled = false
format = "[${symbol}×$shlvl ]($style)"
symbol = "󰆍"
threshold = 2

[shell]
bash_indicator = "#!"
zsh_indicator = "z!"
fish_indicator = "\uee41"
powershell_indicator = "󰨊"
ion_indicator = ""
unknown_indicator = "??"
format = "[$indicator ]($style)"
style = "bright-black"
disabled = false

[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed"
# endregion core

# region git
[git_branch]
format = "[$symbol $branch(:$remote_branch)]($style)"
#symbol = "△"
symbol = ""
style = "bold cyan"
truncation_symbol = "⋯"
truncation_length = 16
# ignore_branches = ["main", "master"]
only_attached = true

[git_commit]
format = '[$hash]($style)'
style = "bold italic bright-blue"

[git_status]
format = """
([\
[(*$conflicted$untracked$modified$staged$renamed$deleted)](bright-purple)\
([·](dimmed)◇$ahead_behind)\
$stashed\
]($style))\
"""
style = ""
conflicted = ""
untracked = ""
modified = ""
staged = ""
renamed = ""
deleted = ""
stashed = "◃◈"
ahead = "┤[🠕${count}](italic green)│"
behind = "┤[🠗${count}](italic red)│"
diverged = "╢[🠕${ahead_count}](bold green)┇[🠗${behind_count}](bold red)║"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[git_metrics]
format = """
([▴$added]($added_style))\
([▿$deleted]($deleted_style))\
"""
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
ignore_submodules = true
disabled = false

