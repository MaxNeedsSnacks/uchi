# the hlissner block (via xdg/python.nix)
[env.python]
PYTHONSTARTUP = "$XDG_CONFIG_HOME/python/pythonrc"
PYTHONUSERBASE = "$XDG_DATA_HOME/python"
PYTHONPYCACHEPREFIX = "$XDG_CACHE_HOME/python"
PYTHON_EGG_CACHE = "$XDG_CACHE_HOME/python-eggs"
PYTHONHISTFILE = "$XDG_STATE_HOME/python/python_history"
IPYTHONDIR = "$XDG_CONFIG_HOME/ipython"
JUPYTER_CONFIG_DIR = "$XDG_CONFIG_HOME/jupyter"
PIP_CONFIG_FILE = "$XDG_CONFIG_HOME/pip/pip.conf"
PIP_LOG_FILE = "$XDG_STATE_HOME/pip/log"
PYLINTHOME = "$XDG_DATA_HOME/pylint"
PYLINTRC = "$XDG_CONFIG_HOME/pylint/pylintrc"
WORKON_HOME = "$XDG_DATA_HOME/virtualenvs"
PYENV_ROOT = "$XDG_DATA_HOME/pyenv" # drop if mise wins the java/js decision
VIRTUAL_ENV_DISABLE_PROMPT = 1
