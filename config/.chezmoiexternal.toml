{{ if eq .chezmoi.hostname "stargazer" -}}
# caddy with the cloudflare dns plugin baked in, straight from the official
# build service; refreshPeriod doubles as plugin-preserving auto-update
[".local/bin/caddy"]
    type = "file"
    url = "https://caddyserver.com/api/download?os={{ .chezmoi.os }}&arch={{ .chezmoi.arch }}&p=github.com/caddy-dns/cloudflare"
    executable = true
    refreshPeriod = "168h"
{{ end -}}

[".config/fish/themes"]
    type = "archive"
    url = "https://github.com/catppuccin/fish/archive/main.tar.gz"
    stripComponents = 2
    include = ["*/themes/*.theme"]
    refreshPeriod = "168h"

[".config/btop/themes-src/catppuccin"]
    type = "archive"
    url = "https://github.com/catppuccin/btop/archive/main.tar.gz"
    stripComponents = 2
    include = ["*/themes/*.theme"]
    refreshPeriod = "168h"

[".config/btop/themes-src/rose-pine"]
    type = "archive"
    url = "https://github.com/rose-pine/btop/archive/main.tar.gz"
    stripComponents = 1
    include = ["*/*.theme"]
    refreshPeriod = "168h"

[".local/share/gram-dev-extensions/zed-chezmoi-lsp"]
    type = "archive"
    url = "https://github.com/alysson-souza/zed-chezmoi-lsp/archive/refs/heads/main.tar.gz"
    stripComponents = 1
    # need to exclude anything vendored from the source since that breaks compile
    exclude = ["*/grammars/**", "*/extension.wasm"]
    refreshPeriod = "168h"
